# delta-agent 桌面壳打包配置（electron-builder）
# 签名/公证挂起（发布前补齐）：mac 需 Developer ID + notarize，win 证书可选
appId: com.delta.agent
productName: delta-agent
# 内置 @electron/rebuild 捆绑 node-gyp 9.x（gyp 仍 import distutils，Python 3.12+ 必失败），
# 原生模块改由 scripts/rebuild-native.mjs 编译（pnpm dist 已串入，勿删）
npmRebuild: false
directories:
  output: release
files:
  - dist/**
  - package.json
  # workspace 包整体复制时排掉本地测试残留（.gitignore 忽略项）：
  # .tmp-test/ 内含指向旧项目路径的悬空 evil-link，会让 NodeModuleCopyHelper stat 失败
  - "!**/.tmp-test/**"
  - "!**/*.timestamp-*.mjs"
  # 依赖里的测试/示例/文档不参与运行，排除以缩小包体（也让打包过程少读文件）
  - "!**/node_modules/**/{test,tests,__tests__,examples,example,docs,benchmark,benchmarks}/**"
  - "!**/node_modules/**/*.test.*"
  - "!**/node_modules/**/*.spec.*"
# 生产依赖（@delta/core、@delta/shared、better-sqlite3 等）由 electron-builder 自动收集
# 注意：不显式配 asarUnpack。pnpm 的 workspace 包是指向外部的软链，源文件真实路径在
# packages/core 下（路径里没有 node_modules），一旦配置 asarUnpack，app-builder 会对
# 每个文件调用 createFilter 算相对路径并抛「must be under packages/desktop」。
# 原生模块（better-sqlite3 的 .node）由默认 smartUnpack 自动解包，无需手动声明。
extraResources:
  # Vue 控制台构建产物（先 pnpm --filter @delta/web build）
  - from: ../web/dist
    to: web
mac:
  target: dmg
  category: public.app-category.developer-tools
  # 应用图标（源 icons/icon.svg；.gitignore 全局忽略 build/，故放 icons/）
  icon: icons/icon.icns
  # 签名挂起：证书到位后补 identity 与 notarize 段
win:
  target: nsis
  icon: icons/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
