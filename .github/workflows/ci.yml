# M5 跨平台加固：双平台跑同一套 typecheck + 单测 + 冒烟（technical-design §9）
#
# 分支说明：仓库主分支为 master（gitee 远端），此处同时监听 main / master，
# 便于未来镜像到 GitHub 时零改动复用。
# 注意：GitHub Actions 不会在 gitee 上运行，本地质量闸门由 pre-push 钩子兜底
# （见 scripts/hooks/pre-push 与 package.json 的 prepare:hooks）。
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  # 冒烟要真实 Provider 密钥；未配置 secrets 时整体跳过冒烟步骤，避免 PR/fork 必然红灯
  HAS_DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY != '' }}

jobs:
  # 安全闸门：个人运行时数据禁止入库 + 全历史密钥扫描。
  # .gitignore 挡不住"先提交后加规则"（gitleaks 与路径断言见 scripts/hooks/pre-push）。
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks 需要全历史

      - name: Block personal runtime paths (.workbuddy / .delta)
        run: |
          if git ls-tree -r --name-only HEAD | grep -E '^\.workbuddy/|^\.delta/'; then
            echo "::error::个人运行时数据（.workbuddy/ 与 .delta/）禁止入库"
            exit 1
          fi

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: [20]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # 真机冒烟：走 resolveProviderFromEnv（无硬编码密钥，密钥只来自 secrets/env）。
      # 属于联调手段而非静态校验，缺密钥时跳过。
      - name: Smoke
        if: env.HAS_DEEPSEEK_KEY == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: pnpm smoke

      # Web 端冒烟不需要 Provider 密钥，始终执行（F-31 新增用量页已纳入覆盖）
      - name: Smoke (web)
        run: pnpm smoke:web
