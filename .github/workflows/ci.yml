# M5 跨平台加固：双平台跑同一套 typecheck + 单测 + 冒烟（technical-design §9）
#
# 分支说明：默认分支为 main，此处同时监听 master 以兼容 fork / 镜像场景。
# 注意：若托管平台不支持 GitHub Actions，本地质量闸门由 pre-push 钩子兜底
# （见 scripts/hooks/pre-push 与 package.json 的 prepare 脚本）。
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  # 冒烟要真实 Provider 密钥；未配置 secrets 时整体跳过冒烟步骤，避免 PR/fork 必然红灯
  HAS_DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY != '' }}

jobs:
  # 安全闸门：个人运行时数据禁止入库 + 全历史密钥扫描。
  # .gitignore 挡不住"先提交后加规则"（gitleaks 与路径断言见 scripts/hooks/pre-push）。
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks 需要全历史

      - name: Block personal runtime paths (.workbuddy / .delta)
        run: |
          if git ls-tree -r --name-only HEAD | grep -E '^\.workbuddy/|^\.delta/'; then
            echo "::error::个人运行时数据（.workbuddy/ 与 .delta/）禁止入库"
            exit 1
          fi

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: [20]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 注意顺序：typecheck 会先构建 shared/core 的 .d.ts（build:deps），
      # 因为 workspace 包的类型入口指向 dist；全新 clone 必须先有声明文件才能过 tsc。
      - name: Typecheck
        run: pnpm typecheck

      # 失败时把用例名打成 annotation：check-run 的 annotations 接口可匿名读取，
      # 而 job 日志接口需要 admin 权限，靠 annotation 才能让外部协作者定位红灯。
      - name: Unit tests
        shell: bash
        run: |
          # 用 /tmp：macOS 与 Windows 的 git bash 都能映射，避免 $RUNNER_TEMP 反斜杠路径问题
          pnpm test 2>&1 | tee /tmp/unit-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "==== 失败用例 ===="
            grep -aE "FAIL " /tmp/unit-test.log | sed 's/\r$//' | head -10 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "==== 日志尾部 ===="
            tail -50 /tmp/unit-test.log
            exit "$status"
          fi

      - name: Build
        run: pnpm build

      # 真机冒烟：走 resolveProviderFromEnv（无硬编码密钥，密钥只来自 secrets/env）。
      # 属于联调手段而非静态校验，缺密钥时跳过。
      - name: Smoke
        if: env.HAS_DEEPSEEK_KEY == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: pnpm smoke

      # Web 端冒烟不需要 Provider 密钥，始终执行（F-31 新增用量页已纳入覆盖）
      - name: Smoke (web)
        run: pnpm smoke:web
