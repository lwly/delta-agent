# M5 跨平台加固：双平台跑同一套 typecheck + 单测 + 冒烟（technical-design §9）
#
# 分支说明：默认分支为 main，此处同时监听 master 以兼容 fork / 镜像场景。
# 注意：若托管平台不支持 GitHub Actions，本地质量闸门由 pre-push 钩子兜底
# （见 scripts/hooks/pre-push 与 package.json 的 prepare 脚本）。
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  # 冒烟要真实 Provider 密钥；未配置 secrets 时整体跳过冒烟步骤，避免 PR/fork 必然红灯
  HAS_DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY != '' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: [20]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 注意顺序：typecheck 会先构建 shared/core 的 .d.ts（build:deps），
      # 因为 workspace 包的类型入口指向 dist；全新 clone 必须先有声明文件才能过 tsc。
      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # 真机冒烟：走 resolveProviderFromEnv（无硬编码密钥，密钥只来自 secrets/env）。
      # 属于联调手段而非静态校验，缺密钥时跳过。
      - name: Smoke
        if: env.HAS_DEEPSEEK_KEY == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: pnpm smoke

      # Web 端冒烟不需要 Provider 密钥，始终执行（F-31 新增用量页已纳入覆盖）
      - name: Smoke (web)
        run: pnpm smoke:web
